<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý tiến độ - StudyFlow</title>
  <link rel="stylesheet" href="dist/output.css">
  <script>
    (function () {
      const saved = localStorage.getItem("theme");
      const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
</head>
<body class="bg-surface dark:bg-surface-dark text-ink dark:text-ink-invert transition-colors duration-300">
  
  <!-- Header (Tái sử dụng) -->
   <header class="sticky top-0 z-50 bg-white/95 dark:bg-surface-dark/95 backdrop-blur-sm border-b border-line dark:border-line-invert">
  <nav class="section py-5! flex items-center justify-between">
    <!-- Khối Logo -->
    <a href="index.html" class="flex items-center gap-3 group">
      <div class="flex items-center justify-center w-11 h-11 bg-accent-500 rounded-xl shadow-sm transition-opacity hover:opacity-90">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <span class="font-display text-2xl font-bold text-ink dark:text-ink-invert tracking-tight">StudyFlow</span>
    </a>
    
    <a href="index.html" class="btn btn-outline text-sm">Về trang chủ</a>
  </nav>
</header>

  <main class="section py-10!">
    <div class="max-w-5xl mx-auto">
      <div class="mb-8">
        <h1 class="font-display text-3xl font-bold text-ink dark:text-ink-invert mb-2">Tiến độ học tập</h1>
        <!-- FORM THÊM TIẾN ĐỘ -->
<div class="card !p-6 mb-8 border-2 border-transparent focus-within:border-brand-600 transition-colors">
  <h2 class="font-display text-xl font-bold text-ink dark:text-ink-invert mb-4">Thêm môn học / tiến độ mới</h2>
  
  <form id="add-record-form" class="grid gap-4 md:grid-cols-2 items-start">
    
    <!-- Tên môn học -->
    <div class="flex flex-col gap-1.5">
      <label for="trader-input" class="field-label">Tên môn học <span class="text-red-500">*</span></label>
      <input type="text" id="trader-input" name="trader" class="field-input w-full" required minlength="3" placeholder="Vd: Lập trình C++">
      <p id="trader-input-error" class="text-sm text-red-500 hidden" aria-live="polite"></p>
    </div>

    <!-- Hình thức -->
    <div class="flex flex-col gap-1.5">
      <label for="category-input" class="field-label">Hình thức <span class="text-red-500">*</span></label>
      <select id="category-input" name="category" class="field-input w-full bg-surface dark:bg-surface-dark" required>
        <option value="" disabled selected class="text-black bg-white">-- Chọn hình thức --</option>
        <option value="Lý thuyết" class="text-black bg-white">Lý thuyết</option>
        <option value="Thực hành" class="text-black bg-white">Thực hành</option>
      </select>
      <p id="category-input-error" class="text-sm text-red-500 hidden" aria-live="polite"></p>
    </div>

    <!-- Thời gian học -->
    <div class="flex flex-col gap-1.5">
      <label for="amount-input" class="field-label">Thời gian học (phút) <span class="text-red-500">*</span></label>
      <input type="number" id="amount-input" name="amount" class="field-input w-full" required min="10" placeholder="Vd: 120">
      <p id="amount-input-error" class="text-sm text-red-500 hidden" aria-live="polite"></p>
    </div>

    <!-- Ngày học -->
    <div class="flex flex-col gap-1.5">
      <label for="date-input" class="field-label">Ngày học <span class="text-red-500">*</span></label>
      <input type="date" id="date-input" name="date" class="field-input w-full" required>
      <p id="date-input-error" class="text-sm text-red-500 hidden" aria-live="polite"></p>
    </div>

    <!-- Thông báo tóm tắt lỗi chung & Nút Submit -->
    <div class="md:col-span-2 flex flex-col sm:flex-row items-center justify-between gap-4 mt-2 pt-4 border-t border-line dark:border-line-invert">
      <p id="form-summary-error" class="text-sm font-bold text-red-600 hidden" role="alert">Vui lòng sửa các lỗi bôi đỏ ở trên trước khi lưu.</p>
      <button type="submit" class="btn btn-primary w-full sm:w-auto ml-auto">Lưu tiến độ</button>
    </div>
  </form>
</div>
        <p class="text-muted dark:text-muted-invert">Quản lý và theo dõi các môn học của bạn.</p>
      </div>

      <!-- BẢNG ĐIỀU KHIỂN: TÌM KIẾM, LỌC, SẮP XẾP -->
      <div class="card !p-5 mb-8 grid gap-4 md:grid-cols-4 bg-line/20 dark:bg-line-invert/20 border-transparent">
        <!-- Tìm kiếm -->
        <input type="text" id="search-input" class="field-input w-full" placeholder="🔍 Tìm môn học...">
        
        <!-- Lọc danh mục (category) -->
        <select id="filter-category" class="field-input w-full">
          <option value="all">Tất cả hình thức</option>
          <option value="Lý thuyết">Lý thuyết</option>
          <option value="Thực hành">Thực hành</option>
        </select>

        <!-- Lọc trạng thái (status) -->
        <select id="filter-status" class="field-input w-full">
          <option value="all">Tất cả trạng thái</option>
          <option value="chua-hoc">Chưa học</option>
          <option value="dang-hoc">Đang học</option>
          <option value="da-hoan-thanh">Đã hoàn thành</option>
        </select>

        <!-- Sắp xếp (sort) -->
        <select id="sort-select" class="field-input w-full">
          <option value="date-desc">Mới nhất trước</option>
          <option value="date-asc">Cũ nhất trước</option>
          <option value="amount-desc">Thời gian học giảm dần</option>
          <option value="amount-asc">Thời gian học tăng dần</option>
        </select>
      </div>

      <!-- NƠI RENDER DỮ LIỆU TỪ JAVASCRIPT -->
      <div id="app-container" class="flex flex-col gap-4">
        <!-- Nút Khôi phục dữ liệu mẫu -->
      <div class="mt-8 text-center">
        <button id="btn-restore" class="btn btn-outline text-sm">Khôi phục dữ liệu mẫu</button>
      </div>

    </div>
  </main>

  <!-- TEMPLATE (MẪU) CHỨA HTML CỦA 1 BẢN GHI (Trình duyệt sẽ ẩn khối này) -->
  <template id="record-template">
    <div class="card !p-5 mb-3 border border-line dark:border-line-invert hover:border-accent-500 transition-colors flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h4 class="font-display font-bold text-lg text-ink dark:text-ink-invert mb-1" data-cell="trader"></h4>
        <div class="flex flex-wrap gap-3 text-xs text-muted dark:text-muted-invert">
          <span class="flex items-center gap-1">📅 <span data-cell="date"></span></span>
          <span class="flex items-center gap-1">📚 <span data-cell="category"></span></span>
          <span class="flex items-center gap-1">⏱️ <span data-cell="amount"></span> phút</span>
        </div>
      </div>
      <span class="badge shrink-0 text-center" data-cell="status"></span>
    </div>
  </template>

  <script type="module" src="./js/tasks.js"></script>
</body>
</html>
        <!-- JS sẽ vẽ HTML vào đây -->
      </div>
    </div>
  </main>

  <script type="module" src="./js/tasks.js"></script>
</body>
</html>
